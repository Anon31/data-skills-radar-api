name: CI/CD Pipeline - Data Skills Radar API

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -   uses: actions/checkout@v4

      -   name: Set environment variables
          run: |
            echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
            if [[ "${{ github.ref_name }}" == "master" ]]; then
              echo "DOCKER_TAG=production" >> $GITHUB_ENV
            else
              echo "DOCKER_TAG=staging" >> $GITHUB_ENV
            fi

      -   name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '24'
            cache: 'npm'

      -   name: Install, Lint and Test API
          run: |
            npm ci
            npx prisma generate
            npm run lint
            npm run test # Exécute les tests Vitest générés par NestJS

      -   name: Log in to GHCR
          if: github.event_name == 'push'
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

      -   name: Build and push API image
          if: github.event_name == 'push'
          uses: docker/build-push-action@v6
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: ghcr.io/${{ env.IMAGE_NAME }}-api:${{ env.DOCKER_TAG }}

