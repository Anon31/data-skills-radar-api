name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# 1. Configuration des Catégories et du calcul SemVer (Syntaxe v7)
categories:
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      label: 'major'

  - title: '🚀 Nouvelles Fonctionnalités'
    semver-increment: 'minor'
    when:
      label: 'feature'

  - title: '🐛 Corrections de Bugs'
    semver-increment: 'patch'
    when:
      label: 'fix'

  - title: '📚 Documentation'
    semver-increment: 'patch'
    when:
      label: 'documentation'

  - title: '🎨 Style & Formatage'
    semver-increment: 'patch'
    when:
      label: 'style'

  - title: '♻️ Refactoring'
    semver-increment: 'patch'
    when:
      label: 'refactor'

  - title: '🧪 Tests'
    semver-increment: 'patch'
    when:
      label: 'test'

  - title: '⚙️ Tâches Techniques'
    semver-increment: 'patch'
    when:
      label: 'chore'

  - title: '🏭 CI/CD & DevOps'
    semver-increment: 'patch'
    when:
      label: 'cicd'

# 2. Configuration de l'Autolabeler (Le "Traducteur")
autolabeler:
  - label: 'feature'
    regex:
      - '^feat(\(.*\))?:'
      - '^feature(\(.*\))?:'
  - label: 'fix'
    regex:
      - '^fix(\(.*\))?:'
      - '^bug(\(.*\))?:'
  - label: 'documentation'
    regex:
      - '^docs(\(.*\))?:'
  - label: 'style'
    regex:
      - '^style(\(.*\))?:'
  - label: 'refactor'
    regex:
      - '^refactor(\(.*\))?:'
  - label: 'test'
    regex:
      - '^test(\(.*\))?:'
  - label: 'chore'
    regex:
      - '^chore(\(.*\))?:'
  - label: 'cicd'
    regex:
      - '^ci(\(.*\))?:'
      - '^cicd(\(.*\))?:'

template: |
  ## Modifications
  $CHANGES
